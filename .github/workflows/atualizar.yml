name: Atualizar clipping

# Triggers:
# 1. workflow_dispatch — disparo manual via UI ou API (botão "Atualizar agora")
# 2. schedule — cron automático às 5:30 BRT (8:30 UTC) de segunda a sexta
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'  # 5:30 BRT (UTC-3) de seg-sex

permissions:
  contents: write  # necessário pra commitar de volta no repo

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar coletor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 coletor.py

      - name: Commitar e fazer push do dashboard atualizado
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add index.html dashboard.html data/
          if git diff --staged --quiet; then
            echo "Nada novo pra commitar"
          else
            git commit -m "Atualização automática: clipping $(date +%Y-%m-%d)"
            git push
          fi
